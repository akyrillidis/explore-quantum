# Map view of the research log (assets/js/log.js). Posts sit on a 1600 x 1000 plane at the map: [x, y]
# given in _data/posts.yml (a post without one waits in a row at the bottom). Edges join posts that
# state the relation (companion, builds on, same series); the label shows when either note is hovered.
axes:
  left: "← PROOFS"
  right: "EXPERIMENTS →"
  top: "↑ CLASSICAL ALGORITHMS"
  bottom: "↓ QUANTUM ALGORITHMS"
edges:
  - [/LowRankMaxCut_Rank1.html, /LowRankMaxCut_GPU.html, series]
  - [/MaxKCut.html, /LowRankMaxCut_Rank1.html, series]
  - [/MaxKCut.html, /LowRankMaxCut_RandR2.html, series]
  - [/MaxKCut.html, /LowRankMaxCut_DSatur.html, series]
  - [/MaxKCut.html, /LowRankMaxCut_Theory.html, series]
  - [/QLSP_PPA.html, /QLSP_ConditionNumber.html, Catalyst-PPA]
